<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>wled-ha-bridge</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <h1>wled-ha-bridge</h1>
        <div class="live" role="status" aria-label="What the panel is doing">
            <span id="connection" class="badge">connecting</span>
            <span id="showing" class="showing">&mdash;</span>
        </div>
        <div class="save">
            <span id="dirty" class="dirty" hidden>unsaved changes</span>
            <button id="save" type="button" disabled>Save</button>
        </div>
    </header>

    <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="entities" aria-selected="true">Entities</button>
        <button type="button" role="tab" data-tab="flow" aria-selected="false">Flow</button>
        <button type="button" role="tab" data-tab="display" aria-selected="false">Display</button>
    </nav>

    <p id="status" class="status" role="status"></p>

    <main id="panel"></main>

    <script type="module" src="/app.js"></script>
</body>
</html>
